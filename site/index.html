<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="All Shielded Bitcoin presentations. Choose a version to present or study the protocol.">
  <title>Shielded Bitcoin · Presentations</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #070912; color: #dde1f2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; background: radial-gradient(ellipse at 80% 0, #a18cff0d, transparent 55%); }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid #4cc9f0; outline-offset: 5px; border-radius: 4px; }
    .page { max-width: 1120px; margin: 0 auto; padding: 44px 32px 28px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #a4abc5; }
    .brand svg { width: 27px; height: 32px; color: #a18cff; }
    header { padding: 58px 0 36px; }
    .eyebrow { margin: 0 0 15px; color: #a18cff; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(34px, 5vw, 52px); font-weight: 500; line-height: 1.12; letter-spacing: -.04em; }
    .intro { margin: 18px 0 0; color: #a4abc5; font-size: 16px; line-height: 1.7; }
    .catalog { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .deck { padding: 28px; display: flex; flex-direction: column; background: #11142a99; border: 1px solid #242943; border-radius: 14px; }
    .deck.featured { background: linear-gradient(135deg, #1b1735, #11142a); border-color: #a18cff66; }
    .label { color: #9da5c4; text-transform: uppercase; letter-spacing: .12em; font-size: 10px; }
    .featured .label { color: #cfc4ff; }
    h2 { margin: 16px 0 12px; font-size: 23px; font-weight: 500; line-height: 1.25; letter-spacing: -.025em; }
    .description { margin: 0; color: #a4abc5; font-size: 14px; line-height: 1.75; }
    .metadata { display: flex; flex-wrap: wrap; gap: 8px 15px; padding: 21px 0 25px; font-size: 11px; color: #b5bdd8; }
    .metadata span:first-child { color: #4cc9f0; }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 14px 20px; margin-top: auto; font-size: 12px; }
    .primary { display: inline-flex; gap: 18px; align-items: center; background: #242a43; border: 1px solid #3a425f; border-radius: 7px; padding: 11px 14px; }
    .featured .primary { background: #cfc4ff; color: #17102e; border-color: #cfc4ff; }
    .primary:hover { filter: brightness(1.15); }
    .secondary { color: #aeb7d2; padding: 9px 0; }
    .secondary:hover { color: white; text-decoration: underline; text-underline-offset: 4px; }
    footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px; padding: 27px 0 10px; color: #8892b1; font-size: 11px; line-height: 1.7; }
    footer p { margin: 0; }
    kbd { font: inherit; border: 1px solid #3a425f; border-radius: 3px; padding: 1px 5px; }
    @media (max-width: 680px) { .page { padding: 27px 20px; } header { padding-top: 38px; } .catalog { grid-template-columns: 1fr; } .deck { padding: 24px; } }
    @media (prefers-reduced-motion: no-preference) { a { transition: color .15s, filter .15s; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="brand"><svg viewBox="0 0 28 34" fill="none" aria-hidden="true"><path d="M14 2 26 7v10c0 7-6 12-12 15C8 29 2 24 2 17V7L14 2Z" stroke="currentColor" stroke-width="1.5"/><path d="m9 17 3 3 7-7" stroke="currentColor" stroke-width="1.5"/></svg><span>Shielded Bitcoin</span></div>
    <header>
      <p class="eyebrow">Presentations & study</p>
      <h1>Choose where to start.</h1>
      <p class="intro">Four ways to explore the protocol.<br>Open a deck to present, or choose the course to study at your own pace.</p>
    </header>
    <section class="catalog" aria-label="Available versions">
      <!-- DECKS -->
    </section>
    <footer><p>In the presentations: <kbd>←</kbd> <kbd>→</kbd> to navigate · <kbd>p</kbd> for presenter mode</p><p>Estimated presentation times</p></footer>
  </main>
</body>
</html>
